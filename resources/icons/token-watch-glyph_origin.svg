  <!-- The status bar glyph, from resources/logo.svg.
       Cropped to the mark's own bounds (906x452 at +175+392) horizontally and
       padded vertically so the glyph comes out one em wide — the same advance as
       the Codex and Claude glyphs beside it.
       The font sizes a glyph by its viewBox height, so height is the only lever
       available. A tight crop made the mark full height and, being twice as wide
       as it is tall, it overpowered its neighbours; 0.6 em still did. Width is
       what the eye compares between these three, so it is pinned to theirs,
       which puts the height at 452/0.4988. To resize, change that ratio and keep
       the x/width from the artwork bounds. -->
